apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  labels:
    app: github-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mcp
  template:
    metadata:
      labels:
        app: github-mcp
    spec:
      serviceAccountName: urumi-sa
      containers:
        - name: github-mcp
          image: "urumi-github-mcp:latest"
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: urumi-secrets
                  key: GITHUB_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  labels:
    app: github-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: github-mcp
