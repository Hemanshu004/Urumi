apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  labels:
    app: github-mcp
spec:
  replicas: {{ .Values.githubMcp.replicas }}
  selector:
    matchLabels:
      app: github-mcp
  template:
    metadata:
      labels:
        app: github-mcp
    spec:
      serviceAccountName: urumi-sa
      containers:
        - name: github-mcp
          image: "{{ .Values.githubMcp.image.repository }}:{{ .Values.githubMcp.image.tag }}"
          imagePullPolicy: {{ .Values.githubMcp.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: GITHUB_TOKEN
                  optional: true
          resources:
            {{- toYaml .Values.githubMcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: github-mcp
  labels:
    app: github-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
  selector:
    app: github-mcp
