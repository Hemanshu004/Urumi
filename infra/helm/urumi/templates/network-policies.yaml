apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-woo-mcp
  labels:
    app.kubernetes.io/name: urumi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: woo-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
      ports:
        - protocol: TCP
          port: 3001
---
