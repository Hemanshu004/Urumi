{{/*
  Secrets for the Urumi stack.
  Passwords are auto-generated if not provided in values.
  On helm upgrade, existing passwords are preserved via lookup.
*/}}
{{- $secretName := include "urumi.secretName" . }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existingSecret }}
  mariadb-root-password: {{ index $existingSecret.data "mariadb-root-password" }}
  mariadb-password: {{ index $existingSecret.data "mariadb-password" }}
  gateway-db-password: {{ index $existingSecret.data "gateway-db-password" | default (randAlphaNum 24 | b64enc) }}
  gateway-jwt-secret: {{ index $existingSecret.data "gateway-jwt-secret" | default (randAlphaNum 32 | b64enc) }}
  gateway-admin-password: {{ index $existingSecret.data "gateway-admin-password" | default ("admin123" | b64enc) }}
  gateway-member-password: {{ index $existingSecret.data "gateway-member-password" | default ("member123" | b64enc) }}
  MASTER_KEY: {{ index $existingSecret.data "MASTER_KEY" | default (randAlphaNum 32 | b64enc) }}
  LLM_API_KEY: {{ index $existingSecret.data "LLM_API_KEY" | default (default "" .Values.secrets.llmApiKey | b64enc) }}
  GITHUB_TOKEN: {{ index $existingSecret.data "GITHUB_TOKEN" | default (default "" .Values.secrets.githubToken | b64enc) }}
  {{- else }}
  {{- $rootPwd := default (randAlphaNum 24) .Values.secrets.wordpressDbRootPassword }}
  {{- $userPwd := default (randAlphaNum 24) .Values.secrets.wordpressDbPassword }}
  mariadb-root-password: {{ $rootPwd | b64enc | quote }}
  mariadb-password: {{ $userPwd | b64enc | quote }}
  gateway-db-password: {{ randAlphaNum 24 | b64enc | quote }}
  gateway-jwt-secret: {{ randAlphaNum 32 | b64enc | quote }}
  gateway-admin-password: {{ "admin123" | b64enc | quote }}
  gateway-member-password: {{ "member123" | b64enc | quote }}
  MASTER_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  LLM_API_KEY: {{ default "" .Values.secrets.llmApiKey | b64enc | quote }}
  GITHUB_TOKEN: {{ default "" .Values.secrets.githubToken | b64enc | quote }}
  {{- end }}
