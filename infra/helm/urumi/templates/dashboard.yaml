apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-dashboard
  labels:
    app: urumi-dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: urumi-dashboard
  template:
    metadata:
      labels:
        app: urumi-dashboard
    spec:
      serviceAccountName: urumi-sa
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
          ports:
            - containerPort: 8080
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-dashboard
  labels:
    app: urumi-dashboard
spec:
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: urumi-dashboard
