apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-mcp
  labels:
    app: weather-mcp
spec:
  replicas: {{ .Values.weatherMcp.replicas }}
  selector:
    matchLabels:
      app: weather-mcp
  template:
    metadata:
      labels:
        app: weather-mcp
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      serviceAccountName: urumi-sa
      containers:
        - name: weather-mcp
          image: "{{ .Values.weatherMcp.image.repository }}:{{ .Values.weatherMcp.image.tag }}"
          imagePullPolicy: {{ .Values.weatherMcp.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          resources:
            {{- toYaml .Values.weatherMcp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: weather-mcp
  labels:
    app: weather-mcp
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: 3003
  selector:
    app: weather-mcp
