apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "urumi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "urumi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z gateway-db 5432; do
                echo "waiting for gateway-db..."
                sleep 2
              done
      imagePullSecrets:
        - name: ghcr-creds
      serviceAccountName: urumi-sa
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: URUMI_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: gateway-db-password
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.gatewayDb.auth.username }}:$(POSTGRES_PASSWORD)@gateway-db:5432/{{ .Values.gatewayDb.auth.database }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: gateway-jwt-secret
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: gateway-admin-password
                  optional: true
            - name: MEMBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: gateway-member-password
                  optional: true
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: MASTER_KEY
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "urumi.secretName" . }}
                  key: LLM_API_KEY
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "urumi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
