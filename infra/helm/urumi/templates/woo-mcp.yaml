apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.fullname" . }}-woo-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "urumi.name" . }}
      app.kubernetes.io/component: woo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "urumi.name" . }}
        app.kubernetes.io/component: woo-mcp
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      serviceAccountName: urumi-sa
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: {{ .Values.wooMcp.service.port }}
              protocol: TCP
          env:
            - name: WOOCOMMERCE_URL
              value: "http://{{ include "urumi.fullname" . }}-wordpress"
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: urumi-woo-api
                  key: WOOCOMMERCE_CONSUMER_KEY
                  optional: true
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: urumi-woo-api
                  key: WOOCOMMERCE_CONSUMER_SECRET
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "urumi.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.wooMcp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "urumi.name" . }}
    app.kubernetes.io/component: woo-mcp
