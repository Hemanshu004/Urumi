# ============================================================
# Urumi Helm Chart - Default Values
# ============================================================

# -- WordPress
wordpress:
  image:
    repository: wordpress
    tag: "6.7-apache"
    pullPolicy: IfNotPresent
  replicas: 1
  port: 80
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- MariaDB (WordPress database)
wordpressDb:
  image:
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent
  port: 3306
  storage: 1Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Database configuration (non-sensitive)
database:
  name: wordpress
  user: wordpress

# -- Ingress
ingress:
  enabled: true
  className: nginx
  hosts:
    shop: shop.urumi.local
    api: api.urumi.local
    dashboard: dashboard.urumi.local

# -- LLM Provider Configuration
llm:
  provider: "openai"
  baseUrl: "https://api.groq.com/openai/v1"
  model: "openai/gpt-oss-120b"

# -- Secrets
# If left empty, database passwords, JWT secrets, and master keys are auto-generated.
# On helm upgrade, existing secrets in the cluster are preserved via lookup.
# For production, supply strong passwords and external API keys via --set or values files.
secrets:
  # MariaDB root password (auto-generated if empty)
  wordpressDbRootPassword: ""
  # MariaDB application password (auto-generated if empty)
  wordpressDbPassword: ""
  # Initial Gateway admin user password (seedDatabase only seeds admin if provided)
  adminPassword: ""
  # Initial Gateway member user password (seedDatabase only seeds member if provided)
  memberPassword: ""
  # JWT signing secret (minimum 32 characters; auto-generated if empty)
  jwtSecret: ""
  # API key for LLM provider (Groq, OpenAI, or Gemini)
  llmApiKey: ""
  # GitHub Personal Access Token for github-mcp tool calls
  githubToken: ""

dashboard:
  image:
    repository: urumi-dashboard
    tag: latest
    pullPolicy: Never
  replicas: 1
  service:
    port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

githubMcp:
  image:
    repository: urumi-github-mcp
    tag: latest
    pullPolicy: Never
  service:
    port: 3002
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

weatherMcp:
  image:
    repository: urumi-weather-mcp
    tag: latest
    pullPolicy: Never
  service:
    port: 3003
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

wooMcp:
  image:
    repository: urumi-woo-mcp
    tag: latest
    pullPolicy: Never
  service:
    port: 3001
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"


gatewayDb:
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  auth:
    username: urumi
    database: urumi_gateway
  persistence:
    size: 2Gi
    storageClass: ""

gateway:
  image:
    repository: urumi-gateway
    tag: latest
    pullPolicy: Never
  service:
    port: 3000
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
