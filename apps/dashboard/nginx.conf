server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to gateway if not using CORS
    # But we are using api.urumi.local directly via CORS, so no proxy needed here
}
